[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-option-pricing"
version = "1.0.0"
description = "A visual, fast, and educational Monte Carlo simulation engine for European option pricing and Black-Scholes benchmarking"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Rudransh Shukla", email = "rudranshshukla975@gmail.com" },
    { name = "Vaibhav Sharma" },
]
keywords = [
    "quantitative-finance",
    "monte-carlo",
    "option-pricing",
    "black-scholes",
    "geometric-brownian-motion",
    "variance-reduction",
    "antithetic-variates",
    "derivatives",
    "numpy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
monte-carlo = "mc_option_pricing.cli:main"
mc-pricing = "mc_option_pricing.cli:main"

[project.urls]
Homepage = "https://github.com/rudranshshukla975-boop/monte-carlo-option-pricing"
Simulator = "https://rudranshshukla975-boop.github.io/monte-carlo-option-pricing/"
Repository = "https://github.com/rudranshshukla975-boop/monte-carlo-option-pricing"
Issues = "https://github.com/rudranshshukla975-boop/monte-carlo-option-pricing/issues"

[tool.setuptools.packages.find]
include = ["mc_option_pricing*"]
exclude = ["report*", "webapp*", "figures*", "examples*", "tests*"]
